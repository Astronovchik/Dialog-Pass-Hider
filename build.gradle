plugins {
    id "net.fabricmc.fabric-loom-remap" version "${loom_version}" apply false
    id "net.fabricmc.fabric-loom" version "${loom_version}" apply false
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version

    repositories {
        maven {
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/"
        }
    }
}

tasks.register("clean", Delete) {
    delete layout.buildDirectory
    delete subprojects.collect { it.layout.buildDirectory }
}

tasks.register("collectJars", Copy) {
    dependsOn subprojects.collect { "${it.path}:build" }

    from(subprojects.collect { it.layout.buildDirectory.dir("libs") }) {
        include "*.jar"
        exclude "*-sources.jar", "*-dev.jar"
    }
    into layout.buildDirectory.dir("libs")
}

tasks.register("build") {
    group = "build"
    description = "Builds all supported Minecraft variants and collects their distributable JARs."
    dependsOn "collectJars"
}
